name: Build and Deploy

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  CI: false
  GITHUB_USERNAME: ${{ github.repository_owner }}
  REACT_APP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  USE_GITHUB_DATA: "false"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Compile LaTeX Resume 📄
        if: hashFiles('resume/resume.tex') != ''
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          working_directory: resume
          args: "-pdf -file-line-error -interaction=nonstopmode"
        continue-on-error: true

      - name: Copy Compiled Resume 📋
        run: |
          if [ -f resume/resume.pdf ]; then
            echo "Resume compiled successfully. Copying to public and greeting..."
            mkdir -p public
            cp resume/resume.pdf public/jamil_khan.pdf
            cp resume/resume.pdf public/resume.pdf
            cp resume/resume.pdf src/containers/greeting/resume.pdf
          else
            echo "resume.pdf not found in resume/ folder, keeping existing fallback jamil_khan.pdf."
          fi

      - name: Setup Node.js 🔧
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Setup Pages 📄
        uses: actions/configure-pages@v5

      - name: Install and Build 🔧
        env:
          REACT_APP_GROQ_API_KEY: ${{ secrets.REACT_APP_GROQ_API_KEY }}
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Upload artifact 📦
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build

      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4
